name: Encounter audit tests (no APK)
on:
  push:
    branches: [refactor/encounters-audit-947]
    paths:
      - '.github/workflows/encounter-audit.yml'
      - 'app/src/main/java/com/example/data/**'
      - 'app/src/main/java/com/example/viewmodel/Encounter*'
      - 'app/src/test/**'
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Run existing tests and reproducible audit baseline without APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encounter-audit-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/encounter-audit/
  stress:
    needs: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Run 1380 generation samples and 900 XP steps without APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest -PfullEncounterAudit=true --tests 'com.example.data.EncounterGenerationStressTest' --tests 'com.example.data.EncounterXpMatrixAuditTest' --no-daemon --stacktrace
      - name: Preserve stress and XP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encounter-stress-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/encounter-audit/

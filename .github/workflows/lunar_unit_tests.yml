name: Lunar Unit Tests
run-name: Lunar unit tests

on:
  push:
    branches:
      - final-audit-797
    paths:
      - .github/workflows/lunar_unit_tests.yml
      - app/src/test/java/com/example/data/LunarEncounterGeneratorTest.kt
      - app/src/test/java/com/example/data/EncounterGeneratorXpTest.kt
      - app/src/test/java/com/example/data/EncounterLunarXpLoopContractTest.kt
      - app/src/main/java/com/example/data/EncounterExperienceLunar.kt
      - app/src/main/java/com/example/data/EncounterNpcPersistenceCoordinator.kt
      - app/src/test/java/com/example/data/EncounterNpcPersistenceCoordinatorTest.kt

permissions:
  contents: read

jobs:
  unit-tests:
    name: Test Debug Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Run unit tests only (no APK build)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace --console=plain --no-configuration-cache
